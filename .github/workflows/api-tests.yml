name: API Automation - Rest Assured CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  api-automation-tests:
    name: Run API Automation Suite
    runs-on: ubuntu-latest

    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      USERNAME: ${{ secrets.BOOKER_USERNAME }}
      PASSWORD: ${{ secrets.BOOKER_PASSWORD }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Validate Required Secrets
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$USERNAME" ] || [ -z "$PASSWORD" ]; then
            echo "❌ Required GitHub secrets are missing!"
            exit 1
          fi

      - name: Build & Execute API Tests
        run: |
          mvn clean test \
            -Dbase.url=$BASE_URL \
            -Dusername=$USERNAME \
            -Dpassword=$PASSWORD

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: target/surefire-reports

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results