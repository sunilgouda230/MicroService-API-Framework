name: API Automation Tests (Rest Assured)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      USERNAME: ${{ secrets.BOOKER_USERNAME }}
      PASSWORD: ${{ secrets.BOOKER_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: maven

      - name: Verify required environment variables
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$USERNAME" ] || [ -z "$PASSWORD" ]; then
            echo "Required GitHub secrets are missing!"
            exit 1
          fi

      - name: Build and run API tests
        run: mvn clean test -Dbase.url=$BASE_URL -Dusername=$USERNAME -Dpassword=$PASSWORD

      - name: Upload Surefire Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports